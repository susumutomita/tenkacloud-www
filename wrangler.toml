name = "tenkacloud-www"
compatibility_date = "2026-06-01"
pages_build_output_dir = "public"

# NOTE: no `send_email` binding here, on purpose. `wrangler pages deploy`
# validates this file and rejects `send_email` (not a Pages-supported config
# binding), and Pages offers no way to load an alternate config for dev
# (`--config` and WRANGLER_CONFIG are both refused/ignored for Pages commands).
#
# Consequences for the CONTACT_MAILER binding used by functions/api/contact.ts:
#   - local dev:  the binding is absent, so POST /api/contact takes the handled
#                 error path (502 JSON + the form's GitHub Discussions fallback).
#                 The email-building logic itself is unit-tested (test/).
#   - production: the binding and the CONTACT_FROM / CONTACT_TO vars are attached
#                 to the Pages project by Terraform / the Pages dashboard
#                 (Settings -> Functions -> Email bindings). See README.md.
