name: CI

# Supply-chain hardening (mirrors the TenkaCloud repo — mini Shai-Hulud 2nd-wave
# mitigation, https://blog.flatt.tech/entry/mini_shai_hulud_2nd):
# - Safe Chain (Aikido) intercepts installs for malicious-package detection
# - lifecycle scripts disabled during install (npm_config_ignore_scripts + flag)
# - frozen lockfile; .npmrc adds ignore-scripts + min-release-age; trustedDependencies []
# - third-party actions pinned to commit SHAs; least-privilege permissions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.11"
      # Supply Chain Security: malicious-package detection, before any install.
      - name: Setup Safe Chain
        continue-on-error: true
        run: bunx @aikidosec/safe-chain setup-ci
      # Supply Chain Security: install with lifecycle scripts disabled.
      - name: Install (frozen lockfile, no lifecycle scripts)
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  terraform:
    name: terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive
      # -backend=false: validate offline, no Terraform Cloud creds needed.
      - run: terraform init -backend=false
      - run: terraform validate
